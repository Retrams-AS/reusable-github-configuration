name: Setup uv
description: Install uv, set up Python, and sync dependencies

inputs:
  python-version:
    description: Python version to use
    default: "3.10"
  sync:
    description: >-
      Set false for jobs that only need uv's own subcommands (version, publish,
      build) and never import the project. `uv sync` installs the root package
      editable, which for a compiled extension is a full native build -- on a
      runner that has no toolchain, because the -dev packages are installed on
      the build jobs.
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install dependencies
      if: inputs.sync == 'true'
      shell: bash
      run: uv sync
