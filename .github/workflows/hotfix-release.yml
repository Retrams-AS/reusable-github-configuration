name: Hotfix release

# Ships a fix from hotfix/<base>; see the README section "Hotfix release".
# After a failure, dispatch again on the hotfix branch. Never use GitHub's
# Re-run: it keeps the original github.sha.

on:
  workflow_call:
    inputs:
      image:
        description: Full image ref without tag, e.g. registry.digitalocean.com/the-retrams-registry/fot
        required: true
        type: string
      targets:
        description: Space-separated overlay paths to pin, e.g. "k8s/overlays/prod"
        required: true
        type: string
      channel:
        description: Key in the channels file to set; empty when no ApplicationSet reads one
        type: string
        default: ""
      channel-file:
        description: Path to the channels file, relative to the repo root
        type: string
        default: k8s/channels.yaml
      forbidden-paths:
        description: Space-separated paths a hotfix must not touch
        type: string
        default: ""
      image-irrelevant-paths:
        description: Passed to build-and-push-docr.yml
        type: string
        default: ""
      registry_login:
        description: Passed to build-and-push-docr.yml
        type: boolean
        default: false
    secrets:
      DO_ACCESS_KEY:
        description: DigitalOcean API token with registry scope
        required: true
      app-id:
        description: ID of the GitHub App that is a bypass actor on the default-branch ruleset.
        required: true
      app-private-key:
        description: Private key (PEM) of that GitHub App.
        required: true

permissions: {}

concurrency:
  group: hotfix-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base: ${{ steps.check.outputs.base }}
      version: ${{ steps.check.outputs.version }}
      resume: ${{ steps.check.outputs.resume }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout shared scripts at the called ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ._shared
          persist-credentials: false

      - name: Check the hotfix branch
        id: check
        env:
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGETS: ${{ inputs.targets }}
          CHANNEL: ${{ inputs.channel }}
          CHANNEL_FILE: ${{ inputs.channel-file }}
          FORBIDDEN_PATHS: ${{ inputs.forbidden-paths }}
        run: bash ._shared/.github/scripts/hotfix/check.sh

  build:
    needs: check
    if: needs.check.outputs.resume != 'true'
    permissions:
      contents: read
      id-token: write
    uses: Retrams-AS/reusable-github-configuration/.github/workflows/build-and-push-docr.yml@166d72afa806035dc2bbeabf3eb12f3551343f0e # v5.0.0
    with:
      image: ${{ inputs.image }}
      push: true
      registry_login: ${{ inputs.registry_login }}
      image-irrelevant-paths: ${{ inputs.image-irrelevant-paths }}
    secrets:
      DO_ACCESS_KEY: ${{ secrets.DO_ACCESS_KEY }}

  retag:
    needs: [check, build]
    if: needs.check.outputs.resume != 'true'
    runs-on: ubuntu-latest # needs Docker for imagetools
    permissions:
      contents: read
    steps:
      - name: Checkout shared scripts at the called ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ._shared
          persist-credentials: false

      - name: Log in to DOCR (short-lived credentials)
        uses: ./._shared/.github/actions/docr-login
        with:
          token: ${{ secrets.DO_ACCESS_KEY }}

      - name: Promote sha artifact to the hotfix version
        env:
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ needs.check.outputs.version }}
        run: bash ._shared/.github/scripts/release/promote-artifact.sh

  write:
    needs: [check, retag]
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.check.outputs.resume == 'true' || needs.retag.result == 'success') }}
    runs-on: ubuntu-latest
    # contents: read is for the ._shared checkout only; every write goes
    # through the App token.
    permissions:
      contents: read
    steps:
      - name: Checkout shared scripts at the called ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ._shared
          persist-credentials: false

      # The App is an intentional ruleset bypass actor (see promote.yml).
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # zizmor: ignore[github-app]
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write

      - name: Pin the hotfix branch
        id: branch
        if: inputs.channel != '' && needs.check.outputs.resume != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.sha }}
          TARGETS: ${{ inputs.targets }}
          CHANNEL: ${{ inputs.channel }}
          CHANNEL_FILE: ${{ inputs.channel-file }}
          BASE: ${{ needs.check.outputs.base }}
          VERSION: ${{ needs.check.outputs.version }}
        run: bash ._shared/.github/scripts/hotfix/write-branch.sh

      # Idempotent, so it also runs on resume: a run whose release create
      # failed gets it now. HEAD already carries the tag then.
      - name: Tag the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGETS: ${{ inputs.targets }}
          CHANNEL: ${{ inputs.channel }}
          CHANNEL_FILE: ${{ inputs.channel-file }}
          BASE: ${{ needs.check.outputs.base }}
          VERSION: ${{ needs.check.outputs.version }}
          TARGET_SHA: ${{ steps.branch.outputs.commit || github.sha }}
        run: bash ._shared/.github/scripts/hotfix/tag-release.sh

      - name: Move the default branch's pins
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGETS: ${{ inputs.targets }}
          CHANNEL: ${{ inputs.channel }}
          CHANNEL_FILE: ${{ inputs.channel-file }}
          BASE: ${{ needs.check.outputs.base }}
          VERSION: ${{ needs.check.outputs.version }}
        run: bash ._shared/.github/scripts/hotfix/write-main.sh
