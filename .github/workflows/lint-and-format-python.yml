name: Lint and format

# Reusable: ruff check + ruff format --check via uv.
#
# This job declares `id-token: write` unconditionally (see below), so the
# CALLING workflow must also grant it -- for every caller, whether or not
# private-index is used. A caller that doesn't gets rejected at workflow
# validation (`startup_failure`, zero jobs), before any step runs.

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to use
        type: string
        default: "3.10"
      private-index:
        description: >-
          Authenticate to pypi.retrams.no before installing dependencies. Also
          requires a matching pyproject.toml entry for the package; without
          one, resolution silently falls through to public PyPI.
        type: boolean
        default: false
      bao-ca:
        description: PEM of the CA that issued OpenBao's listener certificate
        type: string
        default: ""

permissions: {}

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    permissions:
      # contents: read is not optional. This job had no permissions block, so it
      # inherited the default token; declaring one replaces that default outright
      # and checkout breaks without it.
      contents: read
      # Exchanged with OpenBao for the index token, but only when private-index
      # is true. Granted unconditionally because permissions are static per job:
      # there is no way to scope this to the runs that use it without a second
      # job, and a second job cannot hand credentials over -- the whole design
      # rests on $GITHUB_ENV persisting within one job. Accepted: this makes
      # ACTIONS_ID_TOKEN_REQUEST_* readable by every step, including `uv sync`,
      # which runs third-party build backends. The exposure is bounded by what
      # the token can buy -- the OpenBao role behind the action's defaults is
      # read-only and binds repository_owner, so it grants no more than any org
      # developer already has.
      id-token: write
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout shared actions at the called ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The `job` context resolves the repo + commit SHA of the workflow file
          # that defines this job — i.e. this reusable workflow at the SHA the
          # caller pinned — so the composite action matches the workflow version.
          # (Not available on GitHub Enterprise Server.)
          # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ._shared
          persist-credentials: false

      # Mints before setup-uv, not after: uv-index-name needs the UV_INDEX_*
      # env vars in place before `uv sync` runs. That's the reverse of the
      # ordering build-and-push-docr.yml's comment argues for, but it's forced
      # here and costs seconds, not a disagreement between the two files.
      - name: Mint the index token
        if: inputs.private-index
        uses: ./._shared/.github/actions/openbao-index-token
        with:
          bao-ca: ${{ inputs.bao-ca }}
          uv-index-name: retrams

      - name: Set up uv
        uses: ./._shared/.github/actions/setup-uv
        with:
          python-version: ${{ inputs.python-version || '3.10' }}

      # `._shared` is this repo in the caller's workspace — lint their code, not ours.
      # --extend-exclude adds to the caller's exclude list; --exclude would replace it.
      - name: Run ruff lint
        run: uv run ruff check . --extend-exclude ._shared
      - name: Run ruff format
        run: uv run ruff format --check --extend-exclude ._shared
