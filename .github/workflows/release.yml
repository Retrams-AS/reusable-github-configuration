name: Release (SemVer)

# This repo's OWN release. Not reusable — workflow_dispatch only.
#
# The bump is chosen at dispatch, not inferred. Deriving it from Conventional
# Commit titles was only as accurate as those titles, and a release that
# silently under-versions a breaking change is expensive: consumers pin by SHA
# and read the version to decide whether to read the notes. The dropdown makes
# the decision explicit at the moment it is taken.
#
# Mirrors publish-python-package.yml's `bump` input, so both release paths in
# this org ask the same question the same way.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increment
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Cut SemVer release tag
    runs-on: ubuntu-slim

    permissions:
      contents: write # create the tag ref + release

    steps:
      - name: Guard - releases must run from main
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Releases must be cut from main. This run is on '${REF}'."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Determine and create SemVer tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          # `type: choice` constrains the dispatch UI, not the API — a
          # workflow_dispatch sent over REST can carry any string.
          case "$BUMP" in
            major | minor | patch) ;;
            *) echo "::error::bump must be major, minor or patch, got '$BUMP'."; exit 1 ;;
          esac

          semver_re='^v[0-9]+\.[0-9]+\.[0-9]+$'

          # Highest existing semver tag (base v0.0.0 if none yet).
          tags="$(gh api --paginate "repos/$REPO/tags" --jq '.[].name')"
          latest="$(printf '%s\n' "$tags" \
            | grep -E "$semver_re" \
            | sort -V \
            | tail -n1 || true)"

          if [ -z "$latest" ]; then
            major=0; minor=0; patch=0
          else
            v="${latest#v}"
            major="${v%%.*}"
            rest="${v#*.}"
            minor="${rest%%.*}"
            patch="${rest##*.}"
          fi

          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          tag="v${major}.${minor}.${patch}"

          echo "Previous: ${latest:-<none>}  New tag: $tag  [$BUMP]"

          # Create a lightweight tag ref pointing at the dispatched commit.
          # Fails if the tag already exists, which is the right outcome: it means
          # this bump was already cut and a re-run needs a different one.
          gh api --method POST "repos/$REPO/git/refs" \
            -f "ref=refs/tags/$tag" \
            -f "sha=$SHA"

          # Build the release body: an auto-generated changelog of the merged PRs
          # since the previous tag (editable in the Release UI afterwards).
          if [ -n "$latest" ]; then
            body="$(gh api --method POST "repos/$REPO/releases/generate-notes" \
              -f "tag_name=$tag" -f "previous_tag_name=$latest" --jq '.body')"
          else
            body="$(gh api --method POST "repos/$REPO/releases/generate-notes" \
              -f "tag_name=$tag" --jq '.body')"
          fi

          # Publish the GitHub Release (the notes are editable in the UI after).
          url="$(gh release create "$tag" --verify-tag --title "$tag" --notes "$body")"

          # Report the result so a maintainer can grab the hash to pin against.
          {
            echo "## Released \`$tag\`"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Tag | \`$tag\` |"
            echo "| Previous | \`${latest:-<none>}\` |"
            echo "| Bump | $BUMP |"
            echo "| Commit | \`$SHA\` |"
            echo "| Release | $url |"
            echo ""
            echo "### Pin in a consumer repo"
            echo ""
            echo '```yaml'
            echo "uses: $REPO/.github/actions/setup-uv@$SHA  # $tag"
            echo "uses: $REPO/.github/workflows/lint-and-format-python.yml@$SHA  # $tag"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
