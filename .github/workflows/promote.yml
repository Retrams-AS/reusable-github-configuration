name: Promote

# Reusable: promote-many's "deploy a version to one target" half. Independently
# dispatchable — release once, then promote to each target deliberately. Pick the
# mode from what the Application's targetRevision names: `bump` for the default
# branch, `move-ref` for a deploy ref.
#
# The write uses a dedicated GitHub App's token; that App must be a bypass actor
# on the default branch's ruleset. Design rationale:
# docs/superpowers/specs/2026-07-14-auto-calver-and-direct-promote-design.md

on:
  workflow_call:
    inputs:
      target:
        description: Overlay path whose newTag to bump, e.g. k8s/overlays/prod (mode=bump only)
        required: false
        type: string
        default: ""
      version:
        description: >-
          mode=bump — the value written to newTag. A CalVer for a release, or a
          7-char sha when Build pins a dev overlay; not validated here, since
          release_calver owns the CalVer regex.
          mode=move-ref — the tag or sha the ref is moved onto.
        required: true
        type: string
      mode:
        description: >-
          `bump` rewrites the overlay's newTag on the default branch.
          `move-ref` force-updates refs/heads/<ref> to the commit `version` names.
        type: string
        default: bump
      ref:
        description: Branch to move when mode is move-ref, e.g. deploy/prod
        type: string
        default: ""
    secrets:
      app-id:
        description: ID of the GitHub App that is a bypass actor on the default-branch ruleset.
        required: true
      app-private-key:
        description: Private key (PEM) of that GitHub App.
        required: true

permissions: {}

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions: {}
    # Serialize promotes to the same target so two dispatches can't race the
    # read-modify-write.
    concurrency:
      group: promote-${{ inputs.mode }}-${{ inputs.target }}${{ inputs.ref }}
    steps:
      # A typo in mode would otherwise run neither step and report success.
      - name: Validate mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            bump|move-ref) ;;
            *) echo "::error::mode must be 'bump' or 'move-ref', got '${MODE}'."; exit 1 ;;
          esac

      # Pinned create-github-app-token v3.2.0, token scoped to the minimum
      # (contents write). The App is an intentional ruleset bypass actor (see
      # issue #9), so the github-app audit is acknowledged rather than a
      # misconfiguration.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # zizmor: ignore[github-app]
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write

      - name: Bump newTag on the default branch
        if: inputs.mode == 'bump'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [ -n "$TARGET" ] || { echo "::error::mode=bump needs a target input."; exit 1; }
          name=$(basename "$TARGET")
          file="${TARGET}/kustomization.yaml"

          # Read the file from the default-branch tip (not the dispatched ref)
          # so the update replaces exactly what it read.
          if ! resp=$(gh api "repos/${REPO}/contents/${file}?ref=${DEFAULT_BRANCH}"); then
            echo "::error::${file} not found on ${DEFAULT_BRANCH} — is '${TARGET}' the right overlay path?"
            exit 1
          fi
          blob_sha=$(jq -r .sha <<< "$resp")
          jq -r .content <<< "$resp" | base64 -d > current.yaml

          sed -E "s|(newTag: \")[^\"]*(\")|\1${VERSION}\2|" current.yaml > bumped.yaml
          grep -q "newTag: \"${VERSION}\"" bumped.yaml \
            || { echo "::error::${file} has no quoted newTag line to bump."; exit 1; }
          if cmp -s current.yaml bumped.yaml; then
            echo "${TARGET} is already at ${VERSION}; nothing to promote."
            exit 0
          fi

          # [skip ci]: App-token commits, unlike GITHUB_TOKEN ones, do trigger
          # workflows, and a tag bump has nothing for CI to check.
          gh api --method PUT "repos/${REPO}/contents/${file}" \
            -f message="release: bump ${name} to ${VERSION} [skip ci]" \
            -f content="$(base64 -w0 bumped.yaml)" \
            -f sha="$blob_sha" \
            -f branch="$DEFAULT_BRANCH" > /dev/null
          echo "Promoted \`${TARGET}\` to \`${VERSION}\` on \`${DEFAULT_BRANCH}\`." >> "$GITHUB_STEP_SUMMARY"

      # force, because deploy/<env> moves between release tags whose commits are
      # not descendants of each other. Created on first use, so a service's
      # first promote does not need a hand-made branch.
      - name: Move the deploy ref
        if: inputs.mode == 'move-ref'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          REF: ${{ inputs.ref }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [ -n "$REF" ] || { echo "::error::mode=move-ref needs a ref input."; exit 1; }
          if ! sha=$(gh api "repos/${REPO}/commits/${VERSION}" --jq .sha); then
            echo "::error::${VERSION} does not resolve to a commit in ${REPO} — has it been released?"
            exit 1
          fi
          if gh api "repos/${REPO}/git/ref/heads/${REF}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${REPO}/git/refs/heads/${REF}" \
              -f sha="$sha" -F force=true > /dev/null
          else
            gh api --method POST "repos/${REPO}/git/refs" \
              -f ref="refs/heads/${REF}" -f sha="$sha" > /dev/null
          fi
          echo "Moved \`${REF}\` to \`${VERSION}\` (\`${sha:0:7}\`)." >> "$GITHUB_STEP_SUMMARY"
