name: Promote

# Reusable: promote-many's "deploy a version to one target" half. Independently
# dispatchable — release once, then promote to each target deliberately. Set
# `target` when the Application tracks the default branch and only the image
# moves, `channel` when an ApplicationSet reads the version out of a channels
# file in this repo. Both may be set together: both pointers land in one
# commit.
#
# The write uses a dedicated GitHub App's token; that App must be a bypass actor
# on the default branch's ruleset. Design rationale:
# docs/superpowers/specs/2026-07-14-auto-calver-and-direct-promote-design.md

on:
  workflow_call:
    inputs:
      target:
        description: Overlay path whose newTag to bump, e.g. k8s/overlays/prod
        required: false
        type: string
        default: ""
      version:
        description: >-
          The version to write. A CalVer for a release, or a 7-char sha when Build
          pins a dev overlay; not validated here, since release_calver owns the
          CalVer regex.
        required: true
        type: string
      channel-file:
        description: Path to the channels file, relative to the repo root (channel only)
        type: string
        default: k8s/channels.yaml
      channel:
        description: Key in the channels file to set, e.g. prod
        type: string
        default: ""
      tag:
        description: When set, create refs/tags/<tag> at the commit this run produces.
        type: string
        default: ""
      github-release:
        description: Cut a GitHub Release for the tag (tag only)
        type: boolean
        default: false
    secrets:
      app-id:
        description: ID of the GitHub App that is a bypass actor on the default-branch ruleset.
        required: true
      app-private-key:
        description: Private key (PEM) of that GitHub App.
        required: true

permissions: {}

jobs:
  promote:
    runs-on: ubuntu-latest
    # contents: read is for the ._shared checkout only — declaring any block
    # replaces the default token outright, and checkout needs a scope. Every
    # write this job makes goes through the App token, not this one.
    permissions:
      contents: read
    # Serialize promotes to the same target so two dispatches can't race the
    # read-modify-write.
    concurrency:
      group: promote-${{ inputs.target }}${{ inputs.channel }}
    steps:
      - name: Checkout shared scripts at the called ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ._shared
          persist-credentials: false

      # A run with neither input would otherwise write nothing and report success.
      - name: Validate inputs
        env:
          TARGET: ${{ inputs.target }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ -z "$TARGET" ] && [ -z "$CHANNEL" ]; then
            echo "::error::promote needs a target and/or channel input; neither was set."
            exit 1
          fi

      # Pinned create-github-app-token v3.2.0, token scoped to the minimum
      # (contents write). The App is an intentional ruleset bypass actor (see
      # issue #9), so the github-app audit is acknowledged rather than a
      # misconfiguration.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # zizmor: ignore[github-app]
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write

      - name: Write pointers
        id: write
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          TARGET: ${{ inputs.target }}
          CHANNEL_FILE: ${{ inputs.channel-file }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
        run: bash ._shared/.github/scripts/promote/write-pointers.sh

      - name: Fast-forward the default branch
        id: land
        if: steps.write.outputs.commit != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          COMMIT: ${{ steps.write.outputs.commit }}
        run: bash ._shared/.github/scripts/promote/fast-forward.sh

      - name: Tag the commit
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ steps.write.outputs.commit || github.sha }}
          GITHUB_RELEASE: ${{ inputs.github-release }}
        run: bash ._shared/.github/scripts/promote/tag-and-release.sh
