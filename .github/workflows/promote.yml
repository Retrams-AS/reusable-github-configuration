name: Promote

# Reusable: promote-many's "deploy a version to one target" half. Independently
# dispatchable — release once, then promote to each target deliberately. Set
# `target` when the Application tracks the default branch and only the image
# moves, `channel` when an ApplicationSet reads the version out of a channels
# file in this repo. Both may be set together: both pointers land in one
# commit.
#
# The write uses a dedicated GitHub App's token; that App must be a bypass actor
# on the default branch's ruleset. Design rationale:
# docs/superpowers/specs/2026-07-14-auto-calver-and-direct-promote-design.md

on:
  workflow_call:
    inputs:
      target:
        description: Overlay path whose newTag to bump, e.g. k8s/overlays/prod
        required: false
        type: string
        default: ""
      version:
        description: >-
          The version to write. A CalVer for a release, or a 7-char sha when Build
          pins a dev overlay; not validated here, since release_calver owns the
          CalVer regex.
        required: true
        type: string
      channel-file:
        description: Path to the channels file, relative to the repo root (channel only)
        type: string
        default: k8s/channels.yaml
      channel:
        description: Key in the channels file to set, e.g. prod
        type: string
        default: ""
      tag:
        description: When set, create refs/tags/<tag> at the commit this run produces.
        type: string
        default: ""
    secrets:
      app-id:
        description: ID of the GitHub App that is a bypass actor on the default-branch ruleset.
        required: true
      app-private-key:
        description: Private key (PEM) of that GitHub App.
        required: true

permissions: {}

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions: {}
    # Serialize promotes to the same target so two dispatches can't race the
    # read-modify-write.
    concurrency:
      group: promote-${{ inputs.target }}${{ inputs.channel }}
    steps:
      # A run with neither input would otherwise write nothing and report success.
      - name: Validate inputs
        env:
          TARGET: ${{ inputs.target }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ -z "$TARGET" ] && [ -z "$CHANNEL" ]; then
            echo "::error::promote needs a target and/or channel input; neither was set."
            exit 1
          fi

      # Pinned create-github-app-token v3.2.0, token scoped to the minimum
      # (contents write). The App is an intentional ruleset bypass actor (see
      # issue #9), so the github-app audit is acknowledged rather than a
      # misconfiguration.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # zizmor: ignore[github-app]
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write

      # One commit, both pointers. The Contents API writes one file per call,
      # so writing target and channel separately would produce two commits —
      # exactly the split-write skew a tagged release can't tolerate. Files
      # are read from the default-branch tip; $GITHUB_SHA is that same tip
      # (the fast-forward below only succeeds if it still is), so it also
      # serves as base_tree for the commit built here.
      - name: Write pointers
        id: write
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGET: ${{ inputs.target }}
          CHANNEL_FILE: ${{ inputs.channel-file }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          entries='[]'
          message=""

          if [ -n "$TARGET" ]; then
            name=$(basename "$TARGET")
            file="${TARGET}/kustomization.yaml"

            if ! resp=$(gh api "repos/${REPO}/contents/${file}?ref=${DEFAULT_BRANCH}"); then
              echo "::error::${file} not found on ${DEFAULT_BRANCH} — is '${TARGET}' the right overlay path?"
              exit 1
            fi
            jq -r .content <<< "$resp" | base64 -d > target-current.yaml

            sed -E "s|(newTag: \")[^\"]*(\")|\1${VERSION}\2|" target-current.yaml > target-bumped.yaml
            grep -q "newTag: \"${VERSION}\"" target-bumped.yaml \
              || { echo "::error::${file} has no quoted newTag line to bump."; exit 1; }
            if cmp -s target-current.yaml target-bumped.yaml; then
              echo "${TARGET} is already at ${VERSION}; nothing to promote there."
            else
              blob=$(gh api --method POST "repos/${REPO}/git/blobs" \
                -f content="$(base64 -w0 target-bumped.yaml)" -f encoding=base64 --jq .sha)
              entries=$(jq --arg p "$file" --arg s "$blob" \
                '. + [{path: $p, mode: "100644", type: "blob", sha: $s}]' <<< "$entries")
              message="bump ${name} to ${VERSION}"
            fi
          fi

          if [ -n "$CHANNEL" ]; then
            if ! resp=$(gh api "repos/${REPO}/contents/${CHANNEL_FILE}?ref=${DEFAULT_BRANCH}"); then
              echo "::error::${CHANNEL_FILE} not found on ${DEFAULT_BRANCH}."
              exit 1
            fi
            jq -r .content <<< "$resp" | base64 -d > channel-current.yaml

            # The key must already exist. Creating it on demand would let a typo
            # add `prd:` and report success while the real channel never moves.
            if [ "$(yq "has(\"${CHANNEL}\")" channel-current.yaml)" != "true" ]; then
              echo "::error::${CHANNEL_FILE} has no '${CHANNEL}' key. Add it before promoting."
              exit 1
            fi
            cp channel-current.yaml channel-bumped.yaml
            VERSION="$VERSION" yq -i ".\"${CHANNEL}\" = strenv(VERSION)" channel-bumped.yaml
            if cmp -s channel-current.yaml channel-bumped.yaml; then
              echo "${CHANNEL} is already at ${VERSION}; nothing to promote there."
            else
              blob=$(gh api --method POST "repos/${REPO}/git/blobs" \
                -f content="$(base64 -w0 channel-bumped.yaml)" -f encoding=base64 --jq .sha)
              entries=$(jq --arg p "$CHANNEL_FILE" --arg s "$blob" \
                '. + [{path: $p, mode: "100644", type: "blob", sha: $s}]' <<< "$entries")
              [ -z "$message" ] && message="set ${CHANNEL} to ${VERSION}" || message="${message}, set ${CHANNEL} to ${VERSION}"
            fi
          fi

          if [ -z "$message" ]; then
            echo "commit=" >> "$GITHUB_OUTPUT"
            [ -n "$TAG" ] || echo "Nothing moved; ${VERSION} was already current everywhere requested."
            exit 0
          fi

          base_tree=$(gh api "repos/${REPO}/commits/${GITHUB_SHA}" --jq .commit.tree.sha)
          tree=$(jq -n --arg b "$base_tree" --argjson t "$entries" '{base_tree: $b, tree: $t}' \
            | gh api --method POST "repos/${REPO}/git/trees" --input - --jq .sha)
          # [skip ci]: App-token commits, unlike GITHUB_TOKEN ones, do trigger
          # workflows, and a pointer write has nothing to build.
          commit=$(jq -n --arg m "release: ${message} [skip ci]" \
                         --arg t "$tree" --arg p "$GITHUB_SHA" \
                         '{message: $m, tree: $t, parents: [$p]}' \
            | gh api --method POST "repos/${REPO}/git/commits" --input - --jq .sha)
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "Wrote \`${commit:0:7}\`: ${message}." >> "$GITHUB_STEP_SUMMARY"

      - name: Fast-forward the default branch
        id: land
        if: steps.write.outputs.commit != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          COMMIT: ${{ steps.write.outputs.commit }}
        run: |
          set -euo pipefail
          # No `force`, deliberately: the commit's parent is $GITHUB_SHA, so this
          # is a compare-and-swap. If the branch moved during the run, failing
          # closed is correct — the caller already retagged an image built from
          # $GITHUB_SHA, and re-parenting onto a newer head would tag a tree that
          # image was never built from. Re-dispatching retags from the new head.
          if ! gh api --method PATCH "repos/${REPO}/git/refs/heads/${DEFAULT_BRANCH}" -f sha="$COMMIT" >/dev/null; then
            echo "::error::${DEFAULT_BRANCH} moved during this run; re-dispatch to retag from the new head."
            exit 1
          fi
          echo "Landed \`${COMMIT:0:7}\` on \`${DEFAULT_BRANCH}\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Tag the commit
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ steps.write.outputs.commit || github.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "refs/tags/${TAG} already exists; leaving it."
            exit 0
          fi
          gh api "repos/${REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$TARGET_SHA" >/dev/null
          echo "Tagged \`${TARGET_SHA:0:7}\` as \`${TAG}\`." >> "$GITHUB_STEP_SUMMARY"
