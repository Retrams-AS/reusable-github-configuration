name: Promote

# Reusable: promote-many's "deploy a version to one target" half. Bumps the
# quoted newTag in a single kustomize overlay by committing directly to the
# default branch via the Contents API — that commit is the deploy (Argo CD
# syncs). Independently dispatchable — release once, then promote to each
# target (dev/prod/clinic) deliberately. Rollback = revert the bump commit.
#
# The commit is made with a dedicated GitHub App's token; that App must be a
# bypass actor on the default branch's ruleset. Design rationale:
# docs/superpowers/specs/2026-07-14-auto-calver-and-direct-promote-design.md

on:
  workflow_call:
    inputs:
      target:
        description: Overlay path whose newTag to bump, e.g. k8s/overlays/prod
        required: true
        type: string
      version:
        description: CalVer version to deploy (must already be minted by release_calver)
        required: true
        type: string
    secrets:
      app-id:
        description: ID of the GitHub App that is a bypass actor on the default-branch ruleset.
        required: true
      app-private-key:
        description: Private key (PEM) of that GitHub App.
        required: true

permissions: {}

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions: {}
    # Serialize promotes to the same target so two dispatches can't race the
    # read-modify-write.
    concurrency:
      group: promote-${{ inputs.target }}
    steps:
      # Pinned create-github-app-token v3.2.0, token scoped to the minimum
      # (contents write). The App is an intentional ruleset bypass actor (see
      # issue #9), so the github-app audit is acknowledged rather than a
      # misconfiguration.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # zizmor: ignore[github-app]
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write

      - name: Bump newTag on the default branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          name=$(basename "$TARGET")
          file="${TARGET}/kustomization.yaml"

          # Read the file from the default-branch tip (not the dispatched ref)
          # so the update replaces exactly what it read.
          if ! resp=$(gh api "repos/${REPO}/contents/${file}?ref=${DEFAULT_BRANCH}"); then
            echo "::error::${file} not found on ${DEFAULT_BRANCH} — is '${TARGET}' the right overlay path?"
            exit 1
          fi
          blob_sha=$(jq -r .sha <<< "$resp")
          jq -r .content <<< "$resp" | base64 -d > current.yaml

          sed -E "s|(newTag: \")[^\"]*(\")|\1${VERSION}\2|" current.yaml > bumped.yaml
          grep -q "newTag: \"${VERSION}\"" bumped.yaml \
            || { echo "::error::${file} has no quoted newTag line to bump."; exit 1; }
          if cmp -s current.yaml bumped.yaml; then
            echo "${TARGET} is already at ${VERSION}; nothing to promote."
            exit 0
          fi

          # [skip ci]: App-token commits, unlike GITHUB_TOKEN ones, do trigger
          # workflows, and a tag bump has nothing for CI to check.
          gh api --method PUT "repos/${REPO}/contents/${file}" \
            -f message="release: bump ${name} to ${VERSION} [skip ci]" \
            -f content="$(base64 -w0 bumped.yaml)" \
            -f sha="$blob_sha" \
            -f branch="$DEFAULT_BRANCH" > /dev/null
          echo "Promoted \`${TARGET}\` to \`${VERSION}\` on \`${DEFAULT_BRANCH}\`." >> "$GITHUB_STEP_SUMMARY"
