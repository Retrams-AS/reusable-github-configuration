name: Fast-track classifier

# Classifies one open PR's diff as fast or critical and, when fast, approves it
# as a GitHub App. One org-wide entry point: dispatch it here, on main, naming
# the repo and PR to judge:
#   gh workflow run fast-track.yml -R Retrams-AS/reusable-github-configuration -f repo=<name> -f pr=<n>
#
# OpenBao's role and the Anthropic federation rule both bind this file at main,
# so a run dispatched on any other ref gets neither (spec, "Secrets").

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Repository name in this org, without the owner
        required: true
        type: string
      pr:
        description: Pull request number
        required: true
        type: number

permissions: {}

jobs:
  classify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # contents: read is for the self checkout only; everything on the target repo
    # goes through the App token. id-token: write is for OpenBao and Anthropic.
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    concurrency:
      group: fast-track-${{ inputs.repo }}-${{ inputs.pr }}
    env:
      PROMPT_REF: a8a63eb2c62a8da97455b488b485360fc2a7e159 # agent-plugins
    steps:
      # The inputs are untrusted. The repo name reaches the App token's scope and
      # a checkout, so refuse anything that is not a bare name before either.
      - name: Check the inputs
        env:
          REPO: ${{ inputs.repo }}
        run: |
          [[ "$REPO" =~ ^[A-Za-z0-9._-]+$ && "$REPO" != .* ]] || { echo "::error::repo must be a bare repository name"; exit 1; }

      - name: Checkout this repo's scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ._shared
          persist-credentials: false

      - name: Read secrets from OpenBao
        id: bao
        env:
          BAO_ADDR: https://bao.retrams.no
          BAO_CA: ${{ vars.BAO_SCANNER_CA }}
          AUDIENCE: fast-track
        run: |
          set -euo pipefail

          # An empty PEM fails the TLS handshake and reads like an outage.
          if [ -z "${BAO_CA//[[:space:]]/}" ]; then
            echo "::error::BAO_SCANNER_CA is empty. The OpenBao listener certificate is privately issued, so its CA must be supplied."
            exit 1
          fi
          ca=$(mktemp)
          trap 'rm -f "$ca"' EXIT
          printf '%s\n' "$BAO_CA" > "$ca"

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token available. The calling job needs 'permissions: id-token: write'."
            exit 1
          fi

          oidc=$(curl -sS --fail-with-body \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r .value)
          [ -n "$oidc" ] && [ "$oidc" != "null" ] || { echo "::error::GitHub OIDC token request returned no value"; exit 1; }
          case "$oidc" in
            *[!A-Za-z0-9._-]*) echo "::error::GitHub OIDC token request returned a value that is not a JWT."; exit 1 ;;
          esac
          echo "::add-mask::$oidc"

          svc=$(curl -sS --fail-with-body --cacert "$ca" \
            -X POST "${BAO_ADDR}/v1/auth/jwt/login" \
            -d "$(jq -nc --arg j "$oidc" '{role:"fast-track-classifier",jwt:$j}')" \
            | jq -r .auth.client_token)
          [ -n "$svc" ] && [ "$svc" != "null" ] || { echo "::error::auth/jwt/login returned no client token"; exit 1; }
          case "$svc" in
            *[!A-Za-z0-9._-]*) echo "::error::auth/jwt/login returned a malformed client token."; exit 1 ;;
          esac
          echo "::add-mask::$svc"

          data=$(curl -sS --fail-with-body --cacert "$ca" \
            -H "X-Vault-Token: $svc" "${BAO_ADDR}/v1/ci/data/fast-track" | jq -c .data.data)

          # ::add-mask:: is line-oriented, so mask every line of a multiline
          # value (the PEM) before it is written anywhere.
          for k in client_id app_private_key; do
            v=$(jq -r --arg k "$k" '.[$k] // empty' <<<"$data")
            [ -n "$v" ] || { echo "::error::ci/fast-track has no $k"; exit 1; }
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::add-mask::$line"
            done <<<"$v"
            d="EOF_$(openssl rand -hex 16)"
            { echo "$k<<$d"; printf '%s\n' "$v"; echo "$d"; } >> "$GITHUB_OUTPUT"
          done

      # Workload identity federation: the Anthropic rule binds the same job_workflow_ref as the
      # OpenBao role, so no API key is stored anywhere. The IDs are not secrets.
      - name: Exchange the OIDC token for an Anthropic token
        id: claude
        env:
          RULE_ID: ${{ vars.FAST_TRACK_FEDERATION_RULE_ID }}
          ORG_ID: ${{ vars.FAST_TRACK_ANTHROPIC_ORG_ID }}
          SERVICE_ACCOUNT_ID: ${{ vars.FAST_TRACK_SERVICE_ACCOUNT_ID }}
          WORKSPACE_ID: ${{ vars.FAST_TRACK_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          for v in RULE_ID ORG_ID SERVICE_ACCOUNT_ID WORKSPACE_ID; do
            [ -n "${!v}" ] || { echo "::error::org variable for $v is not set"; exit 1; }
          done

          # A fresh JWT: Anthropic rejects one that carries an already-exchanged jti.
          jwt=$(curl -sS --fail-with-body \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://api.anthropic.com" | jq -r .value)
          case "$jwt" in
            ""|null|*[!A-Za-z0-9._-]*) echo "::error::GitHub OIDC token request returned no JWT"; exit 1 ;;
          esac
          echo "::add-mask::$jwt"

          # A denied exchange is an opaque 401; the reason is on the Console's
          # Workload identity > authentication history page.
          token=$(jq -nc --arg a "$jwt" --arg r "$RULE_ID" --arg o "$ORG_ID" \
              --arg s "$SERVICE_ACCOUNT_ID" --arg w "$WORKSPACE_ID" \
              '{grant_type:"urn:ietf:params:oauth:grant-type:jwt-bearer", assertion:$a,
                federation_rule_id:$r, organization_id:$o, service_account_id:$s, workspace_id:$w}' \
            | curl -sS --fail-with-body -H "content-type: application/json" --data @- \
              https://api.anthropic.com/v1/oauth/token | jq -r .access_token)
          case "$token" in
            ""|null|*[!A-Za-z0-9._-]*) echo "::error::Anthropic token exchange returned no access token"; exit 1 ;;
          esac
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ steps.bao.outputs.client_id }}
          private-key: ${{ steps.bao.outputs.app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.repo }},agent-plugins
          permission-pull-requests: write
          permission-statuses: write
          permission-contents: read

      # Into pr/, never the workspace root: uv searches the working directory and
      # its parents for .venv/bin/python and runs it, so the PR's tree must not
      # sit above the directory uv runs from.
      - name: Checkout the PR
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.repo }}
          ref: refs/pull/${{ inputs.pr }}/head
          token: ${{ steps.app-token.outputs.token }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the classifier prompt
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/${OWNER}/agent-plugins/contents/plugins/retrams-review/agents/fast-track-classifier.md?ref=${PROMPT_REF}" \
            > "$RUNNER_TEMP/prompt.md"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          working-directory: ._shared
          enable-cache: false

      - name: Classify
        env:
          FT_REPO: ${{ github.repository_owner }}/${{ inputs.repo }}
          FT_PR: ${{ inputs.pr }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          ANTHROPIC_ACCESS_TOKEN: ${{ steps.claude.outputs.token }}
          AUDIT_KEY: ${{ steps.bao.outputs.app_private_key }}
          PROMPT_FILE: ${{ runner.temp }}/prompt.md
          GIT_DIR: ${{ github.workspace }}/pr/.git
          GIT_WORK_TREE: ${{ github.workspace }}/pr
        working-directory: ._shared
        run: uv run --no-config --python 3.13 --script .github/scripts/fast-track/fast_track.py run
