name: Release (CalVer)

# Reusable: promote-many's "mint a version" half. Retags the caller's existing
# <image>:<sha7> artifact (built at merge time) to <image>:<version>, tags the
# commit, and optionally cuts a GitHub Release. Never rebuilds. Runs in the
# CALLER's repo (tag + release land there). Pair with promote.yml — the
# resolved version is exposed as an output so promote can be chained.
#
# With pin-overlays, the tag lands on a child of $GITHUB_SHA carrying the new
# newTag rather than on $GITHUB_SHA itself, so the tag names its own image and
# an Application can be pointed at it. The image is still retagged from
# $GITHUB_SHA's sha7 — the commit that actually produced the artifact.
#
# The tag is minted via gh (API), not `git push`, so the checkout needs no
# persisted credentials.
on:
  workflow_call:
    inputs:
      image:
        description: Full image ref without tag, e.g. registry.digitalocean.com/the-retrams-registry/timekontroll-backend
        required: true
        type: string
      version:
        description: >-
          CalVer version to mint, YYYY-MM.N (e.g. 2026-06.1). Omit to auto-mint:
          current UTC year-month, patch = highest existing N for that month + 1.
          If a CalVer tag already points at the commit, that version is reused.
        required: false
        type: string
        default: ""
      make-github-release:
        description: Cut a GitHub Release with generated notes
        type: boolean
        default: true
      pin-overlays:
        description: >-
          Space-separated overlay paths whose kustomization.yaml newTag is set to
          the minted version inside the tagged commit, e.g. "k8s/overlays/prod".
          Empty (default) leaves the tag naming the previous image, which is what
          every caller before v3 relies on.
        type: string
        default: ""
    outputs:
      version:
        description: The CalVer version that was minted (or reused, if the commit was already tagged)
        value: ${{ jobs.release.outputs.version }}
    secrets:
      DO_ACCESS_KEY:
        description: DigitalOcean API token with registry scope
        required: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest # needs Docker for imagetools — not ubuntu-slim
    permissions:
      contents: write
    # Serialize releases so two concurrent dispatches can't auto-mint the same N.
    concurrency:
      group: release-calver
    outputs:
      version: ${{ steps.tag.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # Tag inspection relies on fetch-depth: 0 above (all tags are local).
      - name: Resolve version (auto-mint, validate, new-vs-existing tag)
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          calver='^[0-9]{4}-[0-9]{2}\.[0-9]+$'
          if [ -n "$VERSION" ]; then
            if ! echo "$VERSION" | grep -qE "$calver"; then
              echo "::error::version must be CalVer YYYY-MM.N (e.g. 2026-06.1), got '$VERSION'."
              exit 1
            fi
          else
            existing=$(git tag --points-at "$GITHUB_SHA" | { grep -E "$calver" || true; } | sort -V | tail -1)
            if [ -n "$existing" ]; then
              VERSION="$existing"
              echo "Commit already tagged ${VERSION}; reusing it."
            else
              ym=$(date -u +%Y-%m)
              last=$(git tag -l "${ym}.*" | { grep -E "$calver" || true; } | sed "s/^${ym}\.//" | sort -n | tail -1)
              VERSION="${ym}.$(( ${last:-0} + 1 ))"
              echo "Auto-minting ${VERSION}."
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Release version: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout shared actions at the called ref
        if: steps.tag.outputs.build == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ._shared
          persist-credentials: false

      - name: Log in to DOCR (short-lived credentials)
        if: steps.tag.outputs.build == 'true'
        uses: ./._shared/.github/actions/docr-login
        with:
          token: ${{ secrets.DO_ACCESS_KEY }}

      # Build-once/promote-many: retag the existing sha artifact to the CalVer
      # tag (manifest copy — byte-identical, no rebuild).
      - name: Promote sha artifact to CalVer tag
        if: steps.tag.outputs.build == 'true'
        env:
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          sha7=$(echo "$GITHUB_SHA" | cut -c1-7)
          if ! docker buildx imagetools create --tag "${IMAGE}:${VERSION}" "${IMAGE}:${sha7}"; then
            echo "::error::No artifact ${IMAGE}:${sha7} in DOCR — the Build workflow has not pushed this commit. Dispatch Build, then re-run."
            exit 1
          fi

      # One commit, N files. The Contents API writes one file per call, so N
      # overlays would be N commits — a tag on a tree where only some overlays
      # moved, which is the skew this exists to remove. Reachable only through
      # the tag: no branch ref is updated, so no branch protection applies and
      # the job's contents: write is enough without an App token.
      - name: Pin overlays in the tagged commit
        id: pin
        if: steps.tag.outputs.build == 'true' && inputs.pin-overlays != ''
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          OVERLAYS: ${{ inputs.pin-overlays }}
        run: |
          set -euo pipefail
          entries='[]'
          for overlay in $OVERLAYS; do
            file="${overlay}/kustomization.yaml"
            if [ ! -f "$file" ]; then
              echo "::error::${file} not found at ${GITHUB_SHA} — is '${overlay}' the right overlay path?"
              exit 1
            fi
            sed -E -i "s|(newTag: \")[^\"]*(\")|\1${VERSION}\2|" "$file"
            if ! grep -q "newTag: \"${VERSION}\"" "$file"; then
              echo "::error::${file} has no quoted newTag line to pin."
              exit 1
            fi
            blob=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" \
              -f content="$(base64 -w0 "$file")" -f encoding=base64 --jq .sha)
            entries=$(jq --arg p "$file" --arg s "$blob" \
              '. + [{path: $p, mode: "100644", type: "blob", sha: $s}]' <<< "$entries")
          done
          base_tree=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq .commit.tree.sha)
          tree=$(jq -n --arg b "$base_tree" --argjson t "$entries" '{base_tree: $b, tree: $t}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)
          commit=$(jq -n --arg m "release: pin overlays to ${VERSION} [skip ci]" \
                         --arg t "$tree" --arg p "$GITHUB_SHA" \
                         '{message: $m, tree: $t, parents: [$p]}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)
          echo "sha=${commit}" >> "$GITHUB_OUTPUT"
          echo "Pinned \`${OVERLAYS}\` to \`${VERSION}\` in \`${commit:0:7}\`." >> "$GITHUB_STEP_SUMMARY"

      # Tag the commit only after the image exists. gh release create --target
      # mints the tag + release in one call; the no-release path uses the git
      # refs API. Either way no `git push`, so the checkout stays credential-less.
      - name: Tag the version (+ GitHub Release)
        if: steps.tag.outputs.build == 'true'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          MAKE_RELEASE: ${{ inputs.make-github-release }}
          # The pinned child when pin-overlays is set, $GITHUB_SHA otherwise.
          TARGET_SHA: ${{ steps.pin.outputs.sha || github.sha }}
        run: |
          if [ "$MAKE_RELEASE" = "true" ]; then
            prev=$(gh release list --exclude-pre-releases --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')
            if [ -n "$prev" ]; then
              gh release create "$VERSION" --target "$TARGET_SHA" --title "$VERSION" --generate-notes --notes-start-tag "$prev"
            else
              gh release create "$VERSION" --target "$TARGET_SHA" --title "$VERSION" --generate-notes
            fi
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$TARGET_SHA" >/dev/null
          fi
