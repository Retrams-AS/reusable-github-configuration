name: Release (CalVer)

# Reusable: promote-many's "mint a version" half. Retags the caller's existing
# <image>:<sha7> artifact (built at merge time) to <image>:<version>, tags the
# commit, and optionally cuts a GitHub Release. Never rebuilds. Runs in the
# CALLER's repo (tag + release land there). Pair with promote.yml — the
# resolved version is exposed as an output so promote can be chained.
#
# The tag is minted via gh (API), not `git push`, so the checkout needs no
# persisted credentials.
on:
  workflow_call:
    inputs:
      image:
        description: Full image ref without tag, e.g. registry.digitalocean.com/the-retrams-registry/timekontroll-backend
        required: true
        type: string
      version:
        description: >-
          CalVer version to mint, YYYY-MM.N (e.g. 2026-06.1). Omit to auto-mint:
          current UTC year-month, patch = highest existing N for that month + 1.
          If a CalVer tag already points at the commit, that version is reused.
        required: false
        type: string
        default: ""
      make-github-release:
        description: Cut a GitHub Release with generated notes
        type: boolean
        default: true
      create-tag:
        description: >-
          Create refs/tags/<version> at $GITHUB_SHA. Set to false when the caller
          chains promote, which lands its own commit and tag instead.
        type: boolean
        default: true
    outputs:
      version:
        description: The CalVer version that was minted (or reused, if the commit was already tagged)
        value: ${{ jobs.release.outputs.version }}
    secrets:
      DO_ACCESS_KEY:
        description: DigitalOcean API token with registry scope
        required: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest # needs Docker for imagetools — not ubuntu-slim
    permissions:
      contents: write
    # Serialises the mint and the DOCR retag. It no longer spans the tag write:
    # with create-tag: false that happens in promote's job, under its own group,
    # so two overlapping dispatches can resolve the same N. The fast-forward is
    # what stops both landing — one of them fails there.
    concurrency:
      group: release-calver
    outputs:
      version: ${{ steps.tag.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout shared scripts at the called ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ._shared
          persist-credentials: false

      - name: Resolve version (auto-mint, validate, new-vs-existing tag)
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: bash ._shared/.github/scripts/release/resolve-version.sh

      - name: Log in to DOCR (short-lived credentials)
        if: steps.tag.outputs.build == 'true'
        uses: ./._shared/.github/actions/docr-login
        with:
          token: ${{ secrets.DO_ACCESS_KEY }}

      - name: Promote sha artifact to CalVer tag
        if: steps.tag.outputs.build == 'true'
        env:
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: bash ._shared/.github/scripts/release/promote-artifact.sh

      - name: Tag the version (+ GitHub Release)
        if: steps.tag.outputs.build == 'true' && inputs.create-tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          MAKE_RELEASE: ${{ inputs.make-github-release }}
          TARGET_SHA: ${{ github.sha }}
        run: bash ._shared/.github/scripts/release/tag-and-release.sh

