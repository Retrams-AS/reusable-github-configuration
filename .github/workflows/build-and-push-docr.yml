name: Build and push image to DOCR

# Reusable: builds the caller's Dockerfile and (optionally) pushes the image
# to DOCR tagged with the 7-char commit sha. Callers own the triggers and
# path filters; pass push: false for PR build-only checks. Pair with a
# release flow that promotes sha artifacts to immutable version tags by
# retagging (reference implementation: fot_server).
#
# `image-irrelevant-paths` lets a caller drop its push path filter without
# paying for a build per doc commit, so every commit has an artifact to retag.
#
# If the Dockerfile PULLS a private image (e.g. a prebuilt base), pass
# registry_login: true so build-only runs authenticate too — otherwise they
# fail on an unauthorized pull.
#
# With `private-index: true` the build receives a `netrc` BuildKit secret. The
# Dockerfile must consume it on the layer that installs dependencies, before
# any `USER` switch to non-root -- the secret is mounted uid 0, mode 0400, so
# installing as a later non-root user gets a permission error that reads like
# an auth failure. Install before the `USER` switch, or pass `uid=` on the
# mount if that's not possible:
#
#   RUN --mount=type=secret,id=netrc,target=/tmp/netrc \
#       NETRC=/tmp/netrc uv sync --frozen --no-dev
#
# The same line works locally with
# `docker build --secret id=netrc,src=$HOME/.netrc .`. The caller must also
# grant `id-token: write` -- for every caller, whether or not private-index is
# used, since this job declares it unconditionally. Missing it fails the run
# at workflow validation (`startup_failure`, zero jobs), not partway through.
#
# The token is minted once, immediately before the build, and lives 15 minutes.
# That budget is spent by every layer preceding `uv sync`, so keep the dependency
# install early — ahead of any `apt-get` or full source copy. The longest build in
# the fleet is ~5 minutes today, so this is headroom to preserve, not a live
# problem. The case to watch is `platforms` extended beyond linux/amd64: QEMU
# emulation can push a cold `uv sync` past the window, and the failure reads like
# an index outage rather than an expired token. Re-running mints a fresh one.

on:
  workflow_call:
    inputs:
      image:
        description: Image name without tag, e.g. registry.digitalocean.com/the-retrams-registry/fot
        required: true
        type: string
      push:
        description: Push the sha-tagged image to DOCR (false = build-only check)
        type: boolean
        default: false
      registry_login:
        description: >-
          Log in to DOCR even when not pushing. Needed when the Dockerfile pulls a
          private base image, since a build-only check still has to authenticate.
        type: boolean
        default: false
      platforms:
        description: Target platforms
        type: string
        default: linux/amd64
      context:
        description: Docker build context
        type: string
        default: .
      dockerfile:
        description: Path to the Dockerfile, relative to the repository root (NOT to `context`)
        type: string
        default: Dockerfile
      private-index:
        description: >-
          Authenticate to pypi.retrams.no and expose it to the build as a
          `netrc` BuildKit secret. Also requires a matching pyproject.toml
          entry for the package; without one, resolution silently falls
          through to public PyPI.
        type: boolean
        default: false
      bao-ca:
        description: PEM of the CA that issued OpenBao's listener certificate
        type: string
        default: ""
      spaces-object:
        description: >-
          Spaces object URL to download into the build context before the
          build -- for a binary blob a build needs but that does not belong in
          git, such as a vendor SDK. The Dockerfile COPYs it by basename.
          Empty skips the step entirely; when set, both DO_SPACES secrets are
          required.
        type: string
        default: ""
      build-args:
        description: >-
          Newline-separated KEY=VALUE build arguments. Lets one parameterised
          Dockerfile produce several images, the caller varying these per matrix
          entry -- rmrs-compose builds its MoveIt planner once per arm config
          set this way. Build args land in the image's build history and are
          readable by anyone who can pull it, so never pass a secret here; use
          private-index or a BuildKit secret.
        type: string
        default: ""
      image-irrelevant-paths:
        description: >-
          Space-separated git pathspecs the image does not depend on, e.g.
          "k8s/** docs/** README.md .github/**". When every path changed since the
          parent commit matches one of these, the parent's sha7 artifact is retagged
          instead of rebuilt. Empty (default) always builds.
        type: string
        default: ""
    outputs:
      sha7:
        description: 7-char commit sha the image is tagged with
        value: ${{ jobs.build.outputs.sha7 }}
    secrets:
      DO_ACCESS_KEY:
        description: DigitalOcean API token with registry scope (required when push or registry_login is true)
        required: false
      DO_SPACES_ACCESS_KEY_ID:
        description: Spaces access key (required when spaces-object is set)
        required: false
      DO_SPACES_SECRET_KEY:
        description: Spaces secret key (required when spaces-object is set)
        required: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha7: ${{ steps.sha.outputs.sha7 }}
    permissions:
      # Not optional: this block replaces the default token, and checkout needs it.
      contents: read
      # Unconditional though only private-index spends it, because permissions are
      # static per job and the mint step hands its netrc to a later step in this same
      # job. Bounded: the OpenBao role is read-only and binds repository_owner, and
      # only the netrc crosses into the build, never this token.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # depth 2: the retag decision diffs HEAD against its parent.
          fetch-depth: 2
          persist-credentials: false

      # Cache scope per image: matrix entries sharing a Dockerfile would otherwise
      # share the branch-default scope and evict each other under mode=max.
      - name: Compute sha tag and cache scope
        id: sha
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          echo "sha7=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "scope=${IMAGE##*/}" >> "$GITHUB_OUTPUT"

      # Retag only when EVERY changed path is ignorable. Phrased the other way
      # round, a commit touching both k8s/ and app/ would ship stale code; this
      # way an unanticipated directory falls through to a real build.
      - name: Decide rebuild or retag
        id: plan
        if: inputs.push && inputs.image-irrelevant-paths != ''
        env:
          IGNORABLE: ${{ inputs.image-irrelevant-paths }}
        run: |
          set -euo pipefail
          if ! parent=$(git rev-parse -q --verify "${GITHUB_SHA}^"); then
            echo "No parent commit — building."
            echo "retag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          excludes=()
          for p in $IGNORABLE; do
            excludes+=(":(exclude)${p}")
          done
          relevant=$(git diff --name-only "$parent" "$GITHUB_SHA" -- . "${excludes[@]}")
          if [ -z "$relevant" ]; then
            echo "Only image-irrelevant paths changed since ${parent:0:7} — retagging."
            echo "retag=true" >> "$GITHUB_OUTPUT"
            echo "parent7=${parent:0:7}" >> "$GITHUB_OUTPUT"
          else
            echo "Image-relevant paths changed — building:"
            echo "$relevant"
            echo "retag=false" >> "$GITHUB_OUTPUT"
          fi

      # Authenticate via the org docr-login composite, checked out from this
      # workflow's own repo at the called ref and referenced by local path
      # (./...) — which zizmor's unpinned-uses policy doesn't apply to, so no
      # inlining is needed (mirrors setup-uv in lint-and-format-python.yml).
      # Gated identically to the login step below, plus private-index: the
      # index-token mint step is also referenced by local path, so skipping
      # this checkout while it runs would fail on a missing ./._shared path.
      - name: Checkout shared actions at the called ref
        if: inputs.push || inputs.registry_login || inputs.private-index
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ._shared
          persist-credentials: false

      - name: Log in to DOCR (short-lived credentials)
        if: inputs.push || inputs.registry_login
        uses: ./._shared/.github/actions/docr-login
        with:
          token: ${{ secrets.DO_ACCESS_KEY }}

      # continue-on-error: a parent with no artifact must fall back to a real
      # build rather than break the caller, which is why every step below is
      # gated on this one's outcome rather than on steps.plan.
      - name: Retag the parent's artifact
        id: retag
        if: steps.plan.outputs.retag == 'true'
        continue-on-error: true
        env:
          IMAGE: ${{ inputs.image }}
          SHA7: ${{ steps.sha.outputs.sha7 }}
          PARENT7: ${{ steps.plan.outputs.parent7 }}
        run: docker buildx imagetools create --tag "${IMAGE}:${SHA7}" "${IMAGE}:${PARENT7}"

      # A vendor SDK or the like stays out of git and lives in Spaces, which
      # BuildKit cannot read, so the runner fetches it into the context first --
      # and ahead of the index-token mint, so an 88 MB pull cannot eat that
      # token's 15-minute window. aws-cli is preinstalled on ubuntu runners.
      - name: Fetch object from Spaces into the build context
        if: inputs.spaces-object != '' && steps.retag.outcome != 'success'
        env:
          OBJECT: ${{ inputs.spaces-object }}
          CONTEXT: ${{ inputs.context }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          rest=${OBJECT#https://}
          host=${rest%%/*}
          key=${rest#*/}
          case "$host" in
            *.digitaloceanspaces.com) ;;
            *) echo "spaces-object must be a digitaloceanspaces.com URL, got: $OBJECT" >&2; exit 1 ;;
          esac
          aws s3 cp "s3://${host%%.*}/${key}" "${CONTEXT}/$(basename "$key")" \
            --endpoint-url "https://$(echo "$host" | cut -d. -f2).digitaloceanspaces.com" \
            --no-progress

      - name: Set up Docker Buildx
        if: steps.retag.outcome != 'success'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The token lives 15 minutes; docr-login and buildx setup above do real
      # work, so neither belongs inside that window. Mint it last, right
      # before the step that spends it.
      - name: Mint the index token
        id: index-token
        if: inputs.private-index && steps.retag.outcome != 'success'
        uses: ./._shared/.github/actions/openbao-index-token
        with:
          bao-ca: ${{ inputs.bao-ca }}
          netrc-file: ${{ runner.temp }}/netrc

      - name: Build image
        if: steps.retag.outcome != 'success'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.image }}:${{ steps.sha.outputs.sha7 }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha,scope=${{ steps.sha.outputs.scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.sha.outputs.scope }}
          # secret-files, not secrets: a three-line netrc breaks that input's parsing.
          secret-files: ${{ steps.index-token.outputs.netrc-file && format('netrc={0}', steps.index-token.outputs.netrc-file) || '' }}
