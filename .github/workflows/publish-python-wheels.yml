name: Publish Python wheels

# Reusable: bump -> build wheels on a matrix -> publish to pypi.retrams.no ->
# commit -> tag -> Release. The compiled-extension sibling of
# publish-python-package.yml, which builds with `uv build` on one runner and so
# can only ever produce a wheel for that runner's platform.
#
# ORDER IS LOAD-BEARING, and for the same reasons as the pure-Python workflow:
# publishing happens BEFORE the repo is touched, so a failed publish leaves
# nothing to unwind, and a publish that succeeds while a later step fails heals
# on re-run -- the same bump computes the same version and the upload is skipped
# as already-present. Self-healing stops at the tag; once v<version> exists a
# re-run is refused by the tag guard.
#
# What the matrix forces that the single-job version does not: the bump has to
# happen once, before any build, and its result has to reach every build job.
# `prepare` bumps and uploads the rewritten pyproject.toml + uv.lock; each build
# job downloads them over its checkout so every wheel carries the same version.
# Re-bumping per job would race and produce wheels that disagree.

on:
  workflow_call:
    inputs:
      bump:
        description: Which part of the SemVer to increment
        required: true
        type: string
      environment:
        description: GitHub Environment for the publish job; its name is half of the OpenBao subject
        type: string
        default: release
      publish-url:
        type: string
        default: https://pypi.retrams.no/upload/
      check-url:
        description: Simple index used to skip already-published files. Empty disables the check.
        type: string
        default: https://pypi.retrams.no/simple/
      python-version:
        type: string
        default: "3.11"
      bao-ca:
        description: PEM of the CA that issued OpenBao's listener certificate
        required: true
        type: string

      linux-runner:
        description: >-
          Pin this to the OLDEST distro you support, not -latest. A wheel's
          manylinux tag is set by the glibc of the machine that compiled it, so
          building on a newer runner silently raises the floor and locks out the
          machines you still deploy to.
        type: string
        default: ubuntu-24.04
      linux-apt-packages:
        description: Space-separated apt packages the build needs (e.g. native library -dev headers)
        type: string
        default: ""
      linux-maturin-args:
        description: Extra args for the Linux `maturin build`, e.g. --compatibility manylinux_2_39
        type: string
        default: ""

      build-windows:
        description: Also build a Windows wheel
        type: boolean
        default: false
      windows-runner:
        type: string
        default: windows-2022
      windows-choco-packages:
        description: Space-separated Chocolatey packages the build needs
        type: string
        default: ""
      windows-maturin-args:
        type: string
        default: ""
      windows-delvewheel-add-path:
        description: >-
          Directory holding the DLLs to bundle into the Windows wheel. Empty
          skips the delvewheel repair, leaving the wheel dependent on the
          consuming machine having those DLLs on PATH.
        type: string
        default: ""
    outputs:
      version:
        description: The version that was published
        value: ${{ jobs.prepare.outputs.version }}
    secrets:
      app-id:
        description: ID of the GitHub App that is a bypass actor on the default-branch ruleset.
        required: true
      app-private-key:
        description: Private key (PEM) of that GitHub App.
        required: true

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    # Serialize releases of this repo so two dispatches cannot both bump from
    # the same base version and race the ref update.
    concurrency:
      group: publish-python-${{ github.repository }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.bump.outputs.version }}
      base: ${{ steps.tip.outputs.tip }}
    steps:
      - name: Checkout the caller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout shared actions at the called ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ._shared
          persist-credentials: false

      - uses: ./._shared/.github/actions/setup-uv
        with:
          python-version: ${{ inputs.python-version }}
          # This job never imports the project -- it only shells out to uv's own
          # subcommands. Syncing would compile the extension here, where the
          # native toolchain is deliberately absent.
          sync: "false"

      - name: Bump the version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          case "$BUMP" in
            major|minor|patch) ;;
            *) echo "::error::bump must be major, minor or patch, got '$BUMP'."; exit 1 ;;
          esac
          # Both files are committed as one tree later; if either is missing the
          # commit would write an empty blob and desync them. Fail here, before
          # anything is published, where failing costs nothing.
          [ -f pyproject.toml ] && [ -s uv.lock ] || {
            echo "::error::pyproject.toml and uv.lock must both exist and be non-empty."; exit 1
          }
          # --no-sync: without it uv installs the project into the venv after
          # re-locking, and for a compiled extension that is a full cargo build
          # -- on a runner that has none of the native toolchain, because
          # linux-apt-packages is installed on the build jobs, not here. The
          # re-lock still happens, so uv.lock carries the new version.
          version=$(uv version --bump "$BUMP" --short --no-sync)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing \`$version\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse if the tag already exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Only a genuine 404 means "free". Swallowing every failure would read
          # a 403 or an outage as absence and let the release proceed.
          if out=$(gh api "repos/${REPO}/git/ref/tags/v${VERSION}" 2>&1); then
            echo "::error::Tag v${VERSION} already exists. A previous release minted this version."
            exit 1
          elif ! grep -q 'Not Found' <<<"$out"; then
            echo "::error::Could not determine whether tag v${VERSION} exists: $out"
            exit 1
          fi

      # Recorded before the builds so the publish job can prove the default
      # branch did not move underneath a build that may take many minutes.
      - name: Record the default branch tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/${REPO}/git/ref/heads/${DEFAULT_BRANCH}" --jq .object.sha)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error::${DEFAULT_BRANCH} is at ${tip}, not ${GITHUB_SHA}. Release from the branch tip."
            exit 1
          fi
          echo "tip=$tip" >> "$GITHUB_OUTPUT"

      # Every build job starts from a clean checkout at GITHUB_SHA, which still
      # carries the pre-bump version. These two files carry the bump across.
      - name: Upload the bumped manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bumped-manifests
          path: |
            pyproject.toml
            uv.lock
          if-no-files-found: error

  build-linux:
    needs: prepare
    runs-on: ${{ inputs.linux-runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Apply the bumped version
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bumped-manifests

      - name: Install system dependencies
        if: inputs.linux-apt-packages != ''
        env:
          APT_PACKAGES: ${{ inputs.linux-apt-packages }}
        run: |
          set -euo pipefail
          sudo apt-get update
          # Unquoted on purpose: this is a package list, not one package.
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      # manylinux: off keeps the build on the runner itself rather than in a
      # manylinux container, which is what lets it link the distro's -dev
      # packages installed above. The tag then comes from the runner's glibc,
      # which is why linux-runner must be pinned to the oldest supported distro.
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --strip --out dist ${{ inputs.linux-maturin-args }}
          manylinux: "off"

      # maturin's bundled manylinux policy list can lag the runner's glibc and
      # clamp the tag lower than the binary actually requires -- a wheel tagged
      # more compatible than it is installs happily and fails at import.
      - name: Verify the tag matches the binary
        run: |
          set -euo pipefail
          shopt -s failglob
          pipx run auditwheel show dist/*.whl

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux
          path: dist/*.whl
          if-no-files-found: error

  build-windows:
    needs: prepare
    if: inputs.build-windows
    runs-on: ${{ inputs.windows-runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Apply the bumped version
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bumped-manifests

      - name: Install native dependencies
        if: inputs.windows-choco-packages != ''
        shell: bash
        env:
          CHOCO_PACKAGES: ${{ inputs.windows-choco-packages }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          choco install -y --no-progress $CHOCO_PACKAGES

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --strip --out dist ${{ inputs.windows-maturin-args }}

      # Windows has no auditwheel equivalent in maturin: without this the wheel
      # records the DLLs as external and fails at import on a machine that lacks
      # them. delvewheel is the analogue of auditwheel repair.
      - name: Bundle native DLLs
        if: inputs.windows-delvewheel-add-path != ''
        shell: bash
        env:
          ADD_PATH: ${{ inputs.windows-delvewheel-add-path }}
        run: |
          set -euo pipefail
          shopt -s failglob
          pipx run delvewheel repair --add-path "$ADD_PATH" --wheel-dir repaired dist/*.whl
          rm -f dist/*.whl
          mv repaired/*.whl dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-windows
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: [prepare, build-linux, build-windows]
    # build-windows is skipped when build-windows is false, and a skipped need
    # would skip this job too without an explicit always().
    if: always() && needs.prepare.result == 'success' && needs.build-linux.result == 'success' && needs.build-windows.result != 'failure'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: publish-python-${{ github.repository }}
    permissions:
      id-token: write # OIDC subject exchanged with OpenBao for the index token
      contents: read # clone the private repo and read refs with github.token; every
      # write to the repo (commit, tag, Release) uses the App token instead
    steps:
      - name: Checkout the caller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout shared actions at the called ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ._shared
          persist-credentials: false

      - uses: ./._shared/.github/actions/setup-uv
        with:
          python-version: ${{ inputs.python-version }}
          # This job never imports the project -- it only shells out to uv's own
          # subcommands. Syncing would compile the extension here, where the
          # native toolchain is deliberately absent.
          sync: "false"

      - name: Collect the built wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Apply the bumped version
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bumped-manifests

      # Cheap guard: if the branch moved while we were building, abort now --
      # nothing has been published, so there is nothing to reconcile. Publishing
      # anyway would tag a commit whose code is not what shipped.
      - name: Refuse if the default branch moved
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE: ${{ needs.prepare.outputs.base }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/${REPO}/git/ref/heads/${DEFAULT_BRANCH}" --jq .object.sha)
          if [ "$tip" != "$BASE" ]; then
            echo "::error::${DEFAULT_BRANCH} moved from ${BASE} to ${tip} during the build. Nothing was published; re-run."
            exit 1
          fi

      # Every wheel must carry the version prepare computed. A stale artifact,
      # or a build job that missed the manifest download, would otherwise be
      # published silently alongside the correct ones.
      - name: Verify every wheel carries the bumped version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s failglob
          for whl in dist/*.whl; do
            case "$(basename "$whl")" in
              *-"${VERSION}"-*) ;;
              *) echo "::error::${whl} is not version ${VERSION}."; exit 1 ;;
            esac
          done
          ls -1 dist/ >> "$GITHUB_STEP_SUMMARY"

      - name: Mint the index token
        id: index-token
        uses: ./._shared/.github/actions/openbao-index-token
        with:
          bao-ca: ${{ inputs.bao-ca }}
          # Named explicitly: the action defaults to the read-only pair, and a
          # read token fails at upload rather than at parse time.
          jwt-role: package-index-ci
          identity-role: package-index-publish

      - name: Publish
        env:
          UV_PUBLISH_TOKEN: ${{ steps.index-token.outputs.token }}
          UV_PUBLISH_URL: ${{ inputs.publish-url }}
          CHECK_URL: ${{ inputs.check-url }}
        run: |
          set -euo pipefail
          shopt -s failglob # an empty dist/ must not pass the literal 'dist/*' through
          if [ -n "$CHECK_URL" ]; then
            uv publish --check-url "$CHECK_URL" dist/*
          else
            uv publish dist/*
          fi

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write

      # One commit for two files. The Contents API takes one file per call, so
      # two calls would be two commits and could half-apply, leaving the lockfile
      # out of sync with the manifest on the default branch.
      - name: Commit the bump and tag it
        id: commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BASE: ${{ needs.prepare.outputs.base }}
        run: |
          set -euo pipefail

          base_tree=$(gh api "repos/${REPO}/git/commits/${BASE}" --jq .tree.sha)

          mk_blob() {
            base64 -w0 "$1" \
              | jq -Rsc '{content: ., encoding: "base64"}' \
              | gh api --method POST "repos/${REPO}/git/blobs" --input - --jq .sha
          }
          pyproject_blob=$(mk_blob pyproject.toml)
          lock_blob=$(mk_blob uv.lock)

          # gh's -f flag cannot express an array of OBJECTS (tree[][path]=...
          # silently produces the wrong shape), so build the JSON and pipe it.
          tree=$(jq -nc \
                  --arg base "$base_tree" --arg py "$pyproject_blob" --arg lk "$lock_blob" \
                  '{base_tree:$base, tree:[
                     {path:"pyproject.toml", mode:"100644", type:"blob", sha:$py},
                     {path:"uv.lock",        mode:"100644", type:"blob", sha:$lk}]}' \
                | gh api --method POST "repos/${REPO}/git/trees" --input - --jq .sha)

          # [skip ci]: App-token commits DO trigger workflows, unlike
          # GITHUB_TOKEN ones, and a version bump has nothing for CI to check.
          commit=$(gh api --method POST "repos/${REPO}/git/commits" \
            -f message="release: v${VERSION} [skip ci]" \
            -f tree="$tree" -f "parents[]=${BASE}" --jq .sha)

          # force=false: if anything landed while we were publishing, this is
          # refused rather than dropping that commit. The package IS published;
          # re-running reconciles (the upload is skipped as already-present).
          gh api --method PATCH "repos/${REPO}/git/refs/heads/${DEFAULT_BRANCH}" \
            -f sha="$commit" -F force=false

          gh api --method POST "repos/${REPO}/git/refs" \
            -f ref="refs/tags/v${VERSION}" -f sha="$commit" >/dev/null
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Cut the Release with the wheels attached
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          set -euo pipefail
          shopt -s failglob
          gh release create "v${VERSION}" --title "v${VERSION}" \
            --target "$COMMIT" --generate-notes dist/*
