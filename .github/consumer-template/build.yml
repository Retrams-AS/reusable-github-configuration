name: Build

# Consumer template — copy into .github/workflows/ and edit the marked values.
# Builds every push and PR, and pins dev's overlay to the sha it just built.
# The contract is in this repo's README, under "Manifests and image from one
# revision".

on:
  pull_request:
    paths-ignore: ["README.md", "k8s/**", "docs/**"] # a PR needs no artifact
  push:
    branches: [main] # EDIT: this repo's default branch (main or master)
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    uses: Retrams-AS/reusable-github-configuration/.github/workflows/build-and-push-docr.yml@0000000000000000000000000000000000000000 # v5.0.0 — replace with the tagged sha
    with:
      image: registry.digitalocean.com/the-retrams-registry/CHANGEME # EDIT: this service's image ref
      push: ${{ github.event_name != 'pull_request' }}
      # EDIT: paths that cannot change the image. A push touching only these
      # retags the previous artifact instead of rebuilding. Leave .github out —
      # this file carries the build recipe, so a change here can change the image.
      image-irrelevant-paths: "k8s/** docs/** README.md"
    secrets:
      DO_ACCESS_KEY: ${{ secrets.DO_ACCESS_KEY }}

  pin-dev:
    needs: build
    if: github.event_name == 'push' # a pull_request run has no default branch to write to
    permissions: {}
    uses: Retrams-AS/reusable-github-configuration/.github/workflows/promote.yml@0000000000000000000000000000000000000000 # v5.0.0 — replace with the tagged sha
    with:
      target: k8s/overlays/dev # EDIT: this service's dev overlay path
      version: ${{ needs.build.outputs.sha7 }}
    secrets:
      app-id: ${{ secrets.RELEASE_APP_ID }}
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
